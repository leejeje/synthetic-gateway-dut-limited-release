  episodes_per_training_run: 500
  policies: 7
  evaluation: one frozen-policy rollout per seed and policy
  seed_manifest: seed_manifest.yaml
primary_policies:
  - MAB+PPO
  - Expert Chain
  - MAB-Only
  - PPO-Only
  - DQN
  - Round-Robin
  - Random
ablations:
